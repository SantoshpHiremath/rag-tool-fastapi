name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        run: pytest tests/ -v
      - name: Smoke-test the real running server
        run: |
          AGENT_MODE=stub nohup python3 -m uvicorn app:app --host 0.0.0.0 --port 8010 &
          sleep 2
          curl -sf http://localhost:8010/health
          curl -sf -X POST http://localhost:8010/ask -H "Content-Type: application/json" -d '{"question": "Compute 1 + 1"}'
